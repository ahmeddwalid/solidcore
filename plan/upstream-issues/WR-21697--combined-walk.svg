span x="0" y="0">After: the V extent starts at the first sample</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 700 80)" xml:space="preserve"><tspan x="0" y="0">V (period 12)</tspan></text><rect width="300" height="300" x="700" y="90" fill="none" stroke="#000" stroke-miterlimit="10"/><rect width="150" height="150" x="730" y="215" fill="#f0f0f0" stroke="#000" stroke-miterlimit="10"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" text-anchor="middle" transform="matrix(1 0 0 1 805 268)" xml:space="preserve"><tspan x="0" y="0">face</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="middle" transform="matrix(1 0 0 1 805 288)" xml:space="preserve"><tspan x="0" y="0">U [0.1, 0.6]</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="middle" transform="matrix(1 0 0 1 805 304)" xml:space="preserve"><tspan x="0" y="0">V [1, 7]</tspan></text><circle cx="730" cy="365" r="2.5" fill="#000"/><circle cx="730" cy="340" r="2.5" fill="#000"/><circle cx="730" cy="315" r="2.5" fill="#000"/><circle cx="730" cy="290" r="2.5" fill="#000"/><circle cx="730" cy="265" r="2.5" fill="#000"/><circle cx="730" cy="240" r="2.5" fill="#000"/><circle cx="730" cy="215" r="2.5" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="end" transform="matrix(1 0 0 1 694 95)" xml:space="preserve"><tspan x="0" y="0">V = 12</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="end" transform="matrix(1 0 0 1 694 394)" xml:space="preserve"><tspan x="0" y="0">V = 0</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 700 408)" xml:space="preserve"><tspan x="0" y="0">U = 0</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="end" transform="matrix(1 0 0 1 1000 408)" xml:space="preserve"><tspan x="0" y="0">U = 1</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="middle" transform="matrix(1 0 0 1 850 428)" xml:space="preserve"><tspan x="0" y="0">old V seam: the bottom edge, V = 0</tspan></text><line x1="700" x2="1000" y1="165" y2="165" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 890 158)" xml:space="preserve"><tspan x="0" y="0">new V seam, V = 9</tspan></text><rect width="12" height="150" x="1020" y="215" fill="#dce9f5" stroke="#000" stroke-miterlimit="10"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 1045 294)" xml:space="preserve"><tspan x="0" y="0">V extent [1, 7]</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 1045 160)" xml:space="preserve"><tspan x="0" y="0">unused [7, 1] across the seam:</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 1045 176)" xml:space="preserve"><tspan x="0" y="0">middle 10, snapped to knot 9</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 462)" xml:space="preserve"><tspan x="0" y="0">Square torus, U period 1, V period 12; a sample on the face&apos;s V edges steps 1 in V (dots). Before, each V span was also measured against the U period,</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 478)" xml:space="preserve"><tspan x="0" y="0">so a step of 1 (over half of 1) was taken the long way round, and the spans that did not touch the point at V = 0 were refused.</tspan></text></g></svg>