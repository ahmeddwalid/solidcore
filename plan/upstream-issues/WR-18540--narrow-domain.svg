<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="420" viewBox="0 0 900 420"><title>WR-18540--narrow-domain</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="900" height="420" x="0" y="0" fill="#fff"/><rect id="domain" width="680" height="100" x="80" y="180" fill="#f0f0f0" stroke="#555" stroke-miterlimit="10"/><polygon id="band_U-min" fill="#dce9f5" stroke="#999" stroke-dasharray="5 4" stroke-miterlimit="10" stroke-width="1.5" points="80 166 760 166 760 280 80 280" data-name="band U-min" opacity=".55"/><polygon id="band_U-max" fill="#dce9f5" stroke="#999" stroke-dasharray="5 4" stroke-miterlimit="10" stroke-width="1.5" points="80 180 760 180 760 294 80 294" data-name="band U-max" opacity=".55"/><polygon id="triangle" fill="none" stroke="#1f6fb2" stroke-linejoin="round" stroke-width="3" points="80 280 488 180 760 280"/><text x="0" y="0" fill="#000" font-family="Helvetica-Bold, sans-serif" font-size="20" transform="matrix(1 0 0 1 20 40)" xml:space="preserve"><tspan x="0" y="0">Loop test 2 on a sliver triangle whose plane&apos;s domain is narrower than the side band</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 20 72)" xml:space="preserve"><tspan x="0" y="0">Domain 0.0088 across; each band reaches 2 × 0.005 = 0.01 from its side, so every point of every edge lies in both.</tspan></text><line x1="300" x2="300" y1="306" y2="284" fill="none" stroke="#555" stroke-miterlimit="10"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 160 340)" xml:space="preserve"><tspan x="0" y="0">now: each point lies on the nearer side; the long edge runs along U-max the right way and passes, the short ones cross from side to side.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 770 176)" xml:space="preserve"><tspan x="0" y="0">band of the U-min side</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 770 296)" xml:space="preserve"><tspan x="0" y="0">band of the U-max side</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 160 318)" xml:space="preserve"><tspan x="0" y="0">main: every edge is held to U-min, the side tested first; this edge, which runs along U-max, then goes the wrong way and fails (&quot;Bad Loop Orient&quot;).</tspan></text><line id="arrow_long" x1="370" x2="460" y1="280" y2="280" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="arrow long"/><polygon id="head_long" fill="#1f6fb2" points="460 272 476 280 460 288" data-name="head long"/><line id="arrow_a" x1="300" x2="254" y1="226" y2="237" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="arrow a"/><polygon id="head_a" fill="#1f6fb2" points="258 229 240 241 261 245" data-name="head a"/><line id="arrow_b" x1="680" x2="640" y1="251" y2="236" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="arrow b"/><polygon id="head_b" fill="#1f6fb2" points="637 245 626 231 645 229" data-name="head b"/><line id="v_axis" x1="30" x2="70" y1="140" y2="140" fill="none" stroke="#999" stroke-dasharray="5 4" stroke-miterlimit="10" stroke-width="1.5" data-name="v axis"/><polygon fill="#999" points="66 135 76 140 66 145"/><line id="u_axis" x1="30" x2="30" y1="140" y2="180" fill="none" stroke="#999" stroke-dasharray="5 4" stroke-miterlimit="10" stroke-width="1.5" data-name="u axis"/><polygon fill="#999" points="25 176 30 186 35 176"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 80 145)" xml:space="preserve"><tspan x="0" y="0">v</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 26 204)" xml:space="preserve"><tspan x="0" y="0">u</tspan></text></g></svg>