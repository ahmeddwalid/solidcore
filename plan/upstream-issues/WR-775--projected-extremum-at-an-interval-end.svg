<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="400" viewBox="0 0 900 400"><title>WR-775--projected-extremum-at-an-interval-end</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="900" height="400" x="0" y="0" fill="#fff"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="17" font-weight="bold" transform="matrix(1 0 0 1 20 34)" xml:space="preserve"><tspan x="0" y="0">Projected nearest point of a curve interval, seen along the projection normal</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 40 72)" xml:space="preserve"><tspan x="0" y="0">Foot inside the interval</tspan></text><path fill="none" stroke="#999" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M40 300 C56.2 273 73.372 250.86 91.224 233.493"/><path fill="none" stroke="#999" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M243.029 194.708 C279.688 208.806 316 239.1 350 285"/><path fill="none" stroke="#1f6fb2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M91.224 233.493 C138.831 187.179 191.276 174.804 243.029 194.708"/><line x1="142.489" x2="165.572" y1="97.116" y2="189.269" fill="none" stroke="#999" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><polyline fill="none" stroke="#555" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" points="174.302 187.082 172.115 178.352 163.385 180.538"/><circle cx="165.572" cy="189.269" r="4.5" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="13" text-anchor="middle" transform="matrix(1 0 0 1 169.572 215.269)" xml:space="preserve"><tspan x="0" y="0">answer: the foot</tspan></text><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 255.029 198.708)" xml:space="preserve"><tspan x="0" y="0">interval end</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 40 352)" xml:space="preserve"><tspan x="0" y="0">The line from the foot to P is square to the curve.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 40 370)" xml:space="preserve"><tspan x="0" y="0">The search for feet finds it.</tspan></text><circle cx="91.224" cy="233.493" r="3.5" fill="#555"/><circle cx="243.029" cy="194.708" r="3.5" fill="#555"/><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 105.224 245.493)" xml:space="preserve"><tspan x="0" y="0">interval start</tspan></text><circle cx="142.489" cy="97.116" r="4.5" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="15" font-weight="bold" transform="matrix(1 0 0 1 152.489 91.116)" xml:space="preserve"><tspan x="0" y="0">P</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 490 72)" xml:space="preserve"><tspan x="0" y="0">Foot outside the interval</tspan></text><path fill="none" stroke="#999" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M490 300 C506.2 273 523.372 250.86 541.224 233.493"/><path fill="none" stroke="#999" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M693.029 194.708 C729.688 208.806 766 239.1 800 285"/><path fill="none" stroke="#1f6fb2" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M541.224 233.493 C588.831 187.179 641.276 174.804 693.029 194.708"/><line x1="837.993" x2="769.45" y1="182.786" y2="248.565" fill="none" stroke="#999" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><polyline fill=