"/><circle cx="693.029" cy="194.708" r="4.5" fill="#000"/><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 555.224 245.493)" xml:space="preserve"><tspan x="0" y="0">interval start</tspan></text><circle cx="837.993" cy="182.786" r="4.5" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="15" font-weight="bold" transform="matrix(1 0 0 1 847.993 176.786)" xml:space="preserve"><tspan x="0" y="0">P</tspan></text><line x1="440" x2="440" y1="60" y2="380" fill="none" stroke="#999" stroke-linecap="round" stroke-linejoin="round"/></g></svg>