ansform="matrix(1 0 0 1 280 63)" xml:space="preserve"><tspan x="0" y="14">(b) certified: vertices farther apart</tspan><tspan x="0" y="30.8">than τ_e</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="middle" transform="matrix(1 0 0 1 390 138)" xml:space="preserve"><tspan x="0" y="0">vertex balls of radius τ_e</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 280 200)" xml:space="preserve"><tspan x="0" y="12">the same ridge is a real edge (SmBrep Edge</tspan><tspan x="0" y="26.4">test 7): kept, the healed body is the record&apos;s</tspan></text><text x="0" y="14" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 535 63)" xml:space="preserve"><tspan x="0" y="14">(c) certified: the whole curve within</tspan><tspan x="0" y="30.8">τ_e of M</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 690 125)" xml:space="preserve"><tspan x="0" y="0">τ_e</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 640 185)" xml:space="preserve"><tspan x="0" y="0">M</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 535 275)" xml:space="preserve"><tspan x="0" y="12">squeezed into M; the neighbours (solid) are</tspan><tspan x="0" y="26.4">re-ended at M (dashed)</tspan></text><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 15 285)" xml:space="preserve"><tspan x="0" y="0">Not to scale.</tspan></text></g></svg>