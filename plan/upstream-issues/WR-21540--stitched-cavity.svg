<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="380" viewBox="0 0 760 380"><title>WR-21540--stitched-cavity</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="760" height="380" x="0" y="0" fill="#fff"/><rect id="A_outer_shell" width="260" height="200" x="70" y="80" fill="#f0f0f0" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="A outer shell"/><rect id="A_inner_shell" width="100" height="90" x="150" y="140" fill="#f0f0f0" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="A inner shell"/><rect id="B_outer_shell" width="260" height="200" x="430" y="80" fill="#f0f0f0" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="B outer shell"/><rect id="B_inner_shell" width="100" height="90" x="510" y="140" fill="#fff" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="B inner shell"/><text x="0" y="0" fill="#000" font-family="Helvetica-Bold, sans-serif" font-size="20" transform="matrix(1 0 0 1 70 50)" xml:space="preserve"><tspan x="0" y="0">main: the cavity stays material</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica-Bold, sans-serif" font-size="20" transform="matrix(1 0 0 1 430 50)" xml:space="preserve"><tspan x="0" y="0">this change: the cavity is a void</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 82 108)" xml:space="preserve"><tspan x="0" y="0">material</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 442 108)" xml:space="preserve"><tspan x="0" y="0">material</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 162 178)" xml:space="preserve"><tspan x="0" y="0">cavity:</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 162 198)" xml:space="preserve"><tspan x="0" y="0">material</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 522 178)" xml:space="preserve"><tspan x="0" y="0">cavity:</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 522 198)" xml:space="preserve"><tspan x="0" y="0">void</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 70 302)" xml:space="preserve"><tspan x="0" y="0">outside: void</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 430 302)" xml:space="preserve"><tspan x="0" y="0">outside: void</tspan></text><text x="0" y="12" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 70 318)" xml:space="preserve"><tspan x="0" y="12">The inner shell&apos;s faces lie between two material</tspan><tspan x="0" y="26.4">regions: the export refuses the stitched part.</tspan></text><text x="0" y="12" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 430 318)" xml:space="preserve"><tspan x="0" y="12">Every face lies between material and a void: one</tspan><tspan x="0" y="26.4">solid with a cavity. Regions alternate from the</tspan><tspan x="0" y="40.8">outside in.</tspan></text></g></svg>