<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="470" viewBox="0 0 900 470"><title>WR-18515--squeezed-short-wall</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="900" height="470" x="0" y="0" fill="#fff"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="16" font-weight="bold" transform="matrix(1 0 0 1 30 40)" xml:space="preserve"><tspan x="0" y="0">Main: the second pass squeezes the short wall&apos;s edges</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="16" font-weight="bold" transform="matrix(1 0 0 1 470 40)" xml:space="preserve"><tspan x="0" y="0">Fix: the first pass only</tspan></text><rect width="180" height="200" x="50" y="120" fill="#f0f0f0"/><rect width="40" height="200" x="230" y="120" fill="#f0f0f0"/><rect width="140" height="200" x="270" y="120" fill="#f0f0f0"/><circle cx="250" cy="320" r="45" fill="#dce9f5" opacity=".8"/><line x1="50" x2="230" y1="320" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="50" x2="230" y1="120" y2="120" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="270" x2="410" y1="320" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="270" x2="410" y1="120" y2="120" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="230" x2="270" y1="320" y2="320" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><line x1="230" x2="270" y1="120" y2="120" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><line x1="50" x2="50" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="230" x2="230" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="270" x2="270" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="410" x2="410" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 120 225)" xml:space="preserve"><tspan x="0" y="0">wall A</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 320 225)" xml:space="preserve"><tspan x="0" y="0">wall B</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 242 225)" xml:space="preserve"><tspan x="0" y="0">S</tspan></text><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 215 100)" xml:space="preserve"><tspan x="0" y="0">squeezed out</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 50 385)" xml:space="preserve"><tspan x="0" y="0">second pass at 4e-4: the short wall&apos;s bottom and top edges</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 50 402)" xml:space="preserve"><tspan x="0" y="0">(0.00017 long, lamina) are squeezed out. Its loop keeps two</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 50 419)" xml:space="preserve"><tspan x="0" y="0">side edges: a gap of 0.00017 in 3D and of 1 (its width) in u.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 50 436)" xml:space="preserve"><tspan x="0" y="0">13 edges, 8 vertices; the check refuses the sheet.</tspan></text><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 300 358)" xml:space="preserve"><tspan x="0" y="0">reach of the second pass</tspan></text><line x1="296" x2="283" y1="354" y2="344" fill="none" stroke="#555" stroke-miterlimit="10"/><rect width="180" height="200" x="490" y="120" fill="#f0f0f0"/><rect width="40" height="200" x="670" y="120" fill="#f0f0f0"/><rect width="140" height="200" x="710" y="120" fill="#f0f0f0"/><line x1="490" x2="850" y1="320" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="490" x2="850" y1="120" y2="120" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="490" x2="490" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="670" x2="670" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="710" x2="710" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="850" x2="850" y1="120" y2="320" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 560 225)" xml:space="preserve"><tspan x="0" y="0">wall A</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 760 225)" xml:space="preserve"><tspan x="0" y="0">wall B</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 682 225)" xml:space="preserve"><tspan x="0" y="0">S</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 490 385)" xml:space="preserve"><tspan x="0" y="0">The walls meet exactly at the profile&apos;s shared ends, so</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 490 402)" xml:space="preserve"><tspan x="0" y="0">the first pass (2e-5) joins every side edge. The profile&apos;s</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 490 419)" xml:space="preserve"><tspan x="0" y="0">copies stay open, as meant: every wall keeps four edges.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 490 436)" xml:space="preserve"><tspan x="0" y="0">15 edges, 10 vertices; the check accepts the sheet.</tspan></text><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 30 70)" xml:space="preserve"><tspan x="0" y="0">Walls of an uncapped extrude, unrolled; the short wall S drawn wide.</tspan></text></g></svg>