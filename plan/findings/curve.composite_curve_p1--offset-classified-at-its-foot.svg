<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="470" viewBox="0 0 760 470"><title>offset-tie</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="760" height="470" x="0" y="0" fill="#fff"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 24 36)" xml:space="preserve"><tspan x="0" y="0">Classifying a trimmed offset: its mid point lies exactly d from its own curve</tspan></text><path id="original_arc" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" d="M110 150 C253.594 150 370 266.406 370 410" data-name="original arc"/><path id="offset_arc" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="2" d="M110 190 C231.503 190 330 288.497 330 410" data-name="offset arc"/><line id="radius" x1="110" x2="293.85" y1="410" y2="226.15" fill="none" stroke="#999" stroke-dasharray="6 4" stroke-miterlimit="10" stroke-width="1.5"/><circle id="P" cx="265.56" cy="254.44" r="4" fill="#000"/><circle id="Q" cx="293.85" cy="226.15" r="4" fill="#555"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 302 218)" xml:space="preserve"><tspan x="0" y="0">Q</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 318 218)" xml:space="preserve"><tspan x="0" y="0">its foot on the arc</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-style="italic" transform="matrix(1 0 0 1 282 250)" xml:space="preserve"><tspan x="0" y="0">d</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 118 140)" xml:space="preserve"><tspan x="0" y="0">original arc, r 8.98 about (102.5, -32.5)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 24 440)" xml:space="preserve"><tspan x="0" y="0">centre</tspan></text><circle id="centre" cx="110" cy="410" r="3" fill="#555"/><line id="centre_leader" x1="62" x2="106" y1="436" y2="413" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="centre leader"/><rect id="bound_band" width="320" height="40" x="420" y="200" fill="#dce9f5" data-name="bound band"/><line id="axis" x1="420" x2="740" y1="220" y2="220" fill="none" stroke="#000" stroke-miterlimit="10"/><line id="d_tick" x1="700" x2="700" y1="206" y2="234" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="d tick"/><line id="cutoff_tick" x1="630" x2="630" y1="210" y2="230" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="2" data-name="cutoff tick"/><circle id="value" cx="615.2" cy="220" r="4" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-style="italic" transform="matrix(1 0 0 1 706 198)" xml:space="preserve"><tspan x="0" y="0">d</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 560 166)" xml:space="preserve"><tspan x="0" y="0">upstream&apos;s cutoff</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 560 181)" xml:space="preserve"><tspan x="0" y="0">d (1 - 1e-12) = d - 1.7e-14</tspan></text><line id="cutoff_leader" x1="628" x2="630" y1="186" y2="208" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="cutoff leader"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 470 266)" xml:space="preserve"><tspan x="0" y="0">computed at 2 mm: d - 2.1e-14</tspan></text><line id="value_leader" x1="600" x2="613" y1="256" y2="224" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="value leader"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 350)" xml:space="preserve"><tspan x="0" y="0">upstream: below the cutoff, the offset arc is dropped</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 366)" xml:space="preserve"><tspan x="0" y="0">and its wall is missing (9 faces, not closed)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 392)" xml:space="preserve"><tspan x="0" y="0">now: not proved closer than d, the offset arc is kept</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 408)" xml:space="preserve"><tspan x="0" y="0">(10 faces at every height)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="end" transform="matrix(1 0 0 1 252 266)" xml:space="preserve"><tspan x="0" y="0">mid point of the offset P</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 420 110)" xml:space="preserve"><tspan x="0" y="0">|P - Q| near d, zoomed: 40 pt = 1e-14 mm</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="end" transform="matrix(1 0 0 1 318 386)" xml:space="preserve"><tspan x="0" y="0">offset arc, d = 0.0175 inside</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" text-anchor="end" transform="matrix(1 0 0 1 318 401)" xml:space="preserve"><tspan x="0" y="0">(drawn far wider)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 300)" xml:space="preserve"><tspan x="0" y="0">the rounding bound (the distance&apos;s own and twice the arc&apos;s</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 315)" xml:space="preserve"><tspan x="0" y="0">point error bound) is wider than this whole zoom</tspan></text></g></svg>