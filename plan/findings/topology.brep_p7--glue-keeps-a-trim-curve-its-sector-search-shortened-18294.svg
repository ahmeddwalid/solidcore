<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="320" viewBox="0 0 720 320"><title>glue-trim-curve-18294</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="720" height="320" x="0" y="0" fill="#fff"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 40 40)" xml:space="preserve"><tspan x="0" y="0">Glue: a trim curve made while the pair is placed</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 40 78)" xml:space="preserve"><tspan x="0" y="0">1 placing the pair, on the edge to delete</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 108)" xml:space="preserve"><tspan x="0" y="0">surviving edge, interval [0, t]</tspan></text><line x1="60" x2="320" y1="120" y2="120" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 163)" xml:space="preserve"><tspan x="0" y="0">edge to delete, interval [0, t]</tspan></text><line x1="60" x2="320" y1="175" y2="175" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="2"/><line x1="60" x2="290" y1="205" y2="205" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width="2"/><line x1="290" x2="290" y1="160" y2="215" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><line x1="320" x2="320" y1="160" y2="215" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 296 232)" xml:space="preserve"><tspan x="0" y="0">δ</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 232)" xml:space="preserve"><tspan x="0" y="0">its trim curve, dropped on the net: [0, t − δ]</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 262)" xml:space="preserve"><tspan x="0" y="0">the drop&apos;s recovery trims the edge to delete to it</tspan></text><text x="0" y="0" fill="#555" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 60 280)" xml:space="preserve"><tspan x="0" y="0">(δ = 3.7e-7, drawn large)</tspan></text><line x1="365" x2="365" y1="65" y2="295" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 390 78)" xml:space="preserve"><tspan x="0" y="0">2 the pair moves onto the surviving edge</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 410 108)" xml:space="preserve"><tspan x="0" y="0">surviving edge, still [0, t]</tspan></text><line x1="410" x2="670" y1="120" y2="120" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="410" x2="640" y1="150" y2="150" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width="2"/><line x1="640" x2="640" y1="130" y2="160" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><line x1="670" x2="670" y1="130" y2="160" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 646 177)" xml:space="preserve"><tspan x="0" y="0">δ</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 410 177)" xml:space="preserve"><tspan x="0" y="0">its trim curve, [0, t − δ]: test #25</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 410 232)" xml:space="preserve"><tspan x="0" y="0">Now the pair keeps its trim curve only</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 410 250)" xml:space="preserve"><tspan x="0" y="0">while the curve spans [0, t]; otherwise the</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 410 268)" xml:space="preserve"><tspan x="0" y="0">curve is dropped and made again on the</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 410 286)" xml:space="preserve"><tspan x="0" y="0">surviving edge.</tspan></text></g></svg>