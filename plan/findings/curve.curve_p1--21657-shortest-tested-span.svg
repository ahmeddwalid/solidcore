<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="330" viewBox="0 0 720 330"><title>21657-shortest-tested-span</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="720" height="330" x="0" y="0" fill="#fff"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 30 38)" xml:space="preserve"><tspan x="0" y="0">ApproximateCurve: the shortest tested span</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 30 64)" xml:space="preserve"><tspan x="0" y="0">Lift over [0, 1e-3] of a UV line whose natural interval is [0, 1], tolerance 1e-6</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 30 100)" xml:space="preserve"><tspan x="0" y="0">Before: limit = natural interval / 1500</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" font-weight="bold" transform="matrix(1 0 0 1 390 100)" xml:space="preserve"><tspan x="0" y="0">After: limit = fitted range / 1500</tspan></text><line id="fitted_interval_before" x1="30" x2="330" y1="130" y2="130" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="fitted interval before"/><line id="fitted_interval_after" x1="390" x2="690" y1="130" y2="130" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="fitted interval after"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 30 150)" xml:space="preserve"><tspan x="0" y="0">the fitted interval [0, 1e-3]</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 390 150)" xml:space="preserve"><tspan x="0" y="0">the fitted interval [0, 1e-3]</tspan></text><line id="limit_before" x1="30" x2="2