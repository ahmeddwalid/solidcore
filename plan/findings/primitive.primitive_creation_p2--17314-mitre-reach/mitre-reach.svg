<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="540" viewBox="0 0 760 540"><title>mitre-reach</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="760" height="540" x="0" y="0" fill="#fff"/><rect id="leg_1_tube" width="573.1" height="80" x="100" y="250" fill="#f0f0f0" stroke="#555" stroke-miterlimit="10" data-name="leg 1 tube" opacity=".75"/><polygon id="leg_2_tube" fill="#f0f0f0" stroke="#555" stroke-miterlimit="10" points="268.2 75.4 678 311.9 638 381.3 228.2 144.6" data-name="leg 2 tube" opacity=".75"/><line id="leg_1" x1="100" x2="560" y1="290" y2="290" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="leg 1"/><line id="leg_2" x1="560" x2="248.2" y1="290" y2="110" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="leg 2"/><line id="leg_1_extension" x1="560" x2="673.1" y1="290" y2="290" fill="none" stroke="#999" stroke-dasharray="6 4" stroke-miterlimit="10" stroke-width="1.5" data-name="leg 1 extension"/><line id="leg_2_extension" x1="560" x2="658" y1="290" y2="346.6" fill="none" stroke="#999" stroke-dasharray="6 4" stroke-miterlimit="10" stroke-width="1.5" data-name="leg 2 extension"/><line id="cutting_line" x1="450.7" x2="669.3" y1="260.7" y2="319.3" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="2.5" data-name="cutting line"/><line id="mitre_beyond_reach" x1="669.3" x2="709.3" y1="319.3" y2="330" fill="none" stroke="#000" stroke-dasharray="2 3" stroke-miterlimit="10" data-name="mitre beyond reach"/><circle id="mitre_tip" cx="709.3" cy="330" r="4" fill="#000" data-name="mitre tip"/><circle id="end_of_reach" cx="669.3" cy="319.3" r="3" fill="#555" data-name="end of reach"/><line id="w" x1="115" x2="115" y1="290" y2="250" fill="none" stroke="#999" stroke-dasharray="3 3" stroke-miterlimit="10" stroke-width="1.5"/><text x="0" y="0" fill="#000" font-family="Helvetica-Bold, sans-serif" font-size="20" transform="matrix(1 0 0 1 24 40)" xml:space="preserve"><tspan x="0" y="0">A corner too sharp for its mitre</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 140 318)" xml:space="preserve"><tspan x="0" y="0">leg 1</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 318 128)" xml:space="preserve"><tspan x="0" y="0">leg 2</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 121 275)" xml:space="preserve"><tspan x="0" y="0">w</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 425 281)" xml:space="preserve"><tspan x="0" y="0">β</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 572 243)" xml:space="preserve"><tspan x="0" y="0">extension 2√2 M</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 380 425)" xml:space="preserve"><tspan x="0" y="0">cutting line: reaches 2√2 M each way</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 600 460)" xml:space="preserve"><tspan x="0" y="0">mitre tip, w / sin(β/2)</tspan><tspan x="0" y="16.8">from the corner</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 24 500)" xml:space="preserve"><tspan x="0" y="12">Seen along the path&apos;s normal. Each piece runs 2√2 M past the corner (M: the largest coordinate of the profile&apos;s box). When the mitre tip lies past</tspan><tspan x="0" y="26.4">that reach, the open ends of the pieces are not cut off and the sweep does not close.</tspan></text><line id="leader_cutting_line" x1="560" x2="597" y1="410" y2="304" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="leader cutting line"/><line id="leader_mitre_tip" x1="690" x2="708" y1="444" y2="336" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="leader mitre tip"/></g></svg>