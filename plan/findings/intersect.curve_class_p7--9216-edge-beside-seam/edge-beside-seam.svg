<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="600" viewBox="0 0 900 600"><title>edge-beside-seam</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="900" height="600" x="0" y="0" fill="#fff"/><circle id="tolerance_zone_of_V" cx="430" cy="300" r="55" fill="#dce9f5" data-name="tolerance zone of V"/><polyline id="r_60_circle" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="2" points="150 255.3 165 260.1 180 264.6 195 268.8 210 272.7 225 276.3 240 279.7 255 282.8 270 285.7 285 288.2 300 290.6 315 292.6 330 294.4 345 296 360 297.3 375 298.3 390 299.1 405 299.7 420 299.9 435 300 450 299.8 465 299.3 480 298.6 495 297.6 510 296.4 525 295 540 293.3 555 291.3 570 289 585 286.6 600 283.8 615 280.8 630 277.5 645 273.9 660 270.1 675 266 690 261.6 705 257 720 252 735 246.7 750 241.2" data-name="r 60 circle"/><line id="line_y___-60" x1="150" x2="750" y1="300" y2="300" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="2" data-name="line y = -60"/><circle id="r_3.5_circle" cx="470" cy="430" r="130" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="r 3.5 circle"/><line id="dim_V" x1="430" x2="430" y1="300" y2="226" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5" data-name="dim V"/><line id="dim_S" x1="470" x2="470" y1="300" y2="226" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-miterlimit="10" stroke-width="1.5" data-name="dim S"/><line id="dim_gap" x1="430" x2="470" y1="231" y2="231" fill="none" stroke="#999" stroke-miterlimit="10" stroke-width="1.5" data-name="dim gap"/><circle id="V" cx="430" cy="300" r="5" fill="#000"/><circle id="S" cx="470" cy="300" r="5" fill="#1f6fb2"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 40 45)" xml:space="preserve"><tspan x="0" y="0">#9216: a vertex beside the r 3.5 wall&apos;s seam (plan view, not to scale)</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 40 70)" xml:space="preserve"><tspan x="0" y="12">Before: an edge beside the seam at V withheld V&apos;s tolerance, so the gap failed face test 36. Now only an edge that bounds a face with the seam&apos;s own edge</tspan><tspan x="0" y="26.4">(a sliver) withholds it.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 480 236)" xml:space="preserve"><tspan x="0" y="0">2.6e-8 across the seam: past 1e-9, inside V&apos;s 2e-5</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 560 180)" xml:space="preserve"><tspan x="0" y="0">ring (material)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 150 160)" xml:space="preserve"><tspan x="0" y="0">V&apos;s tolerance zone (2e-5)</tspan></text><line id="leader_tol" x1="300" x2="395" y1="166" y2="256" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width=".75" data-name="leader tol"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 150 360)" xml:space="preserve"><tspan x="0" y="0">vertex V: the loops meet here</tspan></text><line id="leader_V" x1="330" x2="426" y1="348" y2="304" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width=".75" data-name="leader V"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 150 250)" xml:space="preserve"><tspan x="0" y="0">slit B (empty)</tspan></text><line id="leader_B" x1="200" x2="250" y1="255" y2="292" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width=".75" data-name="leader B"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 680 330)" xml:space="preserve"><tspan x="0" y="0">slit C (empty)</tspan></text><line id="leader_C" x1="700" x2="660" y1="318" y2="294" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width=".75" data-name="leader C"/><text x="0" y="14" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 610 385)" xml:space="preserve"><tspan x="0" y="14">S: the seam edge of the r 3.5 wall, one full</tspan><tspan x="0" y="30.8">cylinder, seen end-on</tspan></text><line id="leader_S" x1="608" x2="474" y1="392" y2="304" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width=".75" data-name="leader S"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" text-anchor="middle" transform="matrix(1 0 0 1 470 450)" xml:space="preserve"><tspan x="0" y="0">r 3.5 hole</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 150 440)" xml:space="preserve"><tspan x="0" y="0">lug (material)</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 610 460)" xml:space="preserve"><tspan x="0" y="12">The tips of slits B and C are edges beside the seam</tspan><tspan x="0" y="26.4">at V, on the slits&apos; own walls. No face lies between</tspan><tspan x="0" y="40.8">them and S, so there is no sliver.</tspan></text></g></svg>