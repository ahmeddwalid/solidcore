<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="680" viewBox="0 0 860 680"><title>23136-mixed-chamfer-reflex-rails</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="860" height="680" x="0" y="0" fill="#fff"/><polygon id="top_face" fill="#f0f0f0" points="120 570 760 570 760 360 420 360 420 110 120 110" data-name="top face"/><polygon id="wedge_of_the_concave_chamfer" fill="#dce9f5" points="420 360 500 360 420 280" data-name="wedge of the concave chamfer"/><line id="edge_along_x" x1="420" x2="760" y1="360" y2="360" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width="1.5" data-name="edge along x"/><line id="edge_along_y" x1="420" x2="420" y1="360" y2="110" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width="1.5" data-name="edge along y"/><line id="rail_before__of_the_chamfer_along_x" x1="500" x2="760" y1="280" y2="280" fill="none" stroke="#999" stroke-dasharray="6 4" stroke-miterlimit="10" stroke-width="1.5" data-name="rail before, of the chamfer along x"/><line id="rail_before__of_the_chamfer_along_y" x1="500" x2="500" y1="280" y2="170" fill="none" stroke="#999" stroke-dasharray="6 4" stroke-miterlimit="10" stroke-width="1.5" data-name="rail before, of the chamfer along y"/><line id="concave_chamfer" x1="500" x2="420" y1="360" y2="280" fill="none" stroke="#000" stroke-miterlimit="10" stroke-width="1.5" data-name="concave chamfer"/><line id="mitre_line_of_the_two_convex_chamfers" x1="340" x2="460" y1="440" y2="320" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="1.5" data-name="mitre line of the two convex chamfers"/><line id="mitre_line_on_the_wall_y___0" x1="500" x2="460" y1="360" y2="320" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="1.5" data-name="mitre line on the wall y = 0"/><line id="mitre_line_on_the_wall_x___0" x1="420" x2="460" y1="280" y2="320" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="1.5" data-name="mitre line on the wall x = 0"/><line id="rail_on_the_top__of_the_chamfer_along_x" x1="340" x2="760" y1="440" y2="440" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="rail on the top, of the chamfer along x"/><line id="rail_on_the_top__of_the_chamfer_along_y" x1="340" x2="340" y1="440" y2="110" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="rail on the top, of the chamfer along y"/><circle id="V" cx="420" cy="360" r="4" fill="#000"/><circle id="X_on_the_top" cx="340" cy="440" r="4" fill="#000" data-name="X on the top"/><circle id="X_on_the_wall_y___0" cx="500" cy="360" r="4" fill="#000" data-name="X on the wall y = 0"/><circle id="X_on_the_wall_x___0" cx="420" cy="280" r="4" fill="#000" data-name="X on the wall x = 0"/><circle id="M" cx="460" cy="320" r="4" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" transform="matrix(1 0 0 1 30 36)" xml:space="preserve"><tspan x="0" y="0">Three chamfers of both convexities: the rails on the reflex face</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 30 60)" xml:space="preserve"><tspan x="0" y="0">Plan view of an L block&apos;s inside top corner V. The upright edge at V is concave, the two top edges convex.</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 430 382)" xml:space="preserve"><tspan x="0" y="0">V</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 316 462)" xml:space="preserve"><tspan x="0" y="0">X</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 502 380)" xml:space="preserve"><tspan x="0" y="0">X</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 400 274)" xml:space="preserve"><tspan x="0" y="0">X</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 472 318)" xml:space="preserve"><tspan x="0" y="0">M</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 580 352)" xml:space="preserve"><tspan x="0" y="0">top edge along x (convex)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 525 138)" xml:space="preserve"><tspan x="0" y="0">top edge along y (convex)</tspan></text><line id="leader_to_the_edge_along_y" x1="420" x2="521" y1="134" y2="133" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="leader to the edge along y"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 190 510)" xml:space="preserve"><tspan x="0" y="0">top face: its angle at V is 270 degrees</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 570 320)" xml:space="preserve"><tspan x="0" y="0">notch (no material)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 430 462)" xml:space="preserve"><tspan x="0" y="0">rail on the top face: on the far side of the edge</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 538 272)" xml:space="preserve"><tspan x="0" y="0">rail taken before: towards the other edge</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 570 210)" xml:space="preserve"><tspan x="0" y="0">wedge the concave chamfer adds</tspan></text><line id="leader_to_the_wedge" x1="438" x2="566" y1="310" y2="206" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="leader to the wedge"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 150 210)" xml:space="preserve"><tspan x="0" y="0">mitre lines X-M,</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 150 228)" xml:space="preserve"><tspan x="0" y="0">seen from above</tspan></text><line id="leader_to_the_mitre_line" x1="393.333" x2="220" y1="386.667" y2="234" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width=".75" data-name="leader to the mitre line"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 30 640)" xml:space="preserve"><tspan x="0" y="0">The rails cross at X on the top face. The three chamfer planes meet at M, below the top and past the convex chamfers&apos; rails on the walls,</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 30 658)" xml:space="preserve"><tspan x="0" y="0">over the wedge. A rail taken towards the other edge lies in the notch, where the top face is not, so its chamfer plane was wrong.</tspan></text></g></svg>