mily="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 82 214)" xml:space="preserve"><tspan x="0" y="0">2.39</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 264 200)" xml:space="preserve"><tspan x="0" y="0">2.32</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 266 108)" xml:space="preserve"><tspan x="0" y="0">tol 2</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 190 118)" xml:space="preserve"><tspan x="0" y="0">loop</tspan></text><text x="0" y="0" fill="#1f6fb2" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 160 205)" xml:space="preserve"><tspan x="0" y="0">bisector</tspan></text><rect id="uv_tol_in_parameter" width="310" height="24" x="395" y="138" fill="#dce9f5" data-name="uv tol in parameter"/><line id="interval" x1="420" x2="680" y1="150" y2="150" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3"/><line x1="420" x2="420" y1="142" y2="158" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="1.5"/><line x1="680" x2="680" y1="142" y2="158" fill="none" stroke="#555" stroke-miterlimit="10" stroke-width="1.5"/><circle cx="494.2" cy="150" r="4" fill="#000"/><circle cx="607.9" cy="150" r="4" fill="#000"/><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 416 180)" xml:space="preserve"><tspan x="0" y="0">0</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 676 180)" xml:space="preserve"><tspan x="0" y="0">1</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 395 110)" xml:space="preserve"><tspan x="0" y="0">the bisector&apos;s parameter interval [0, 1]</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 395 127)" xml:space="preserve"><tspan x="0" y="0">inside the zone tolerance mapped to it (band)</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 395 205)" xml:space="preserve"><tspan x="0" y="12">main: ClassifyPoint types both crossings Both, so GetLoopTouches</tspan><tspan x="0" y="26.4">drops every touch as on a degenerate curve: the loop is crossed</tspan><tspan x="0" y="40.8">nowhere and the face is refused (1040).</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 395 275)" xml:space="preserve"><tspan x="0" y="12">this change: each end is checked in 3D. The crossings lie 2.39 and</tspan><tspan x="0" y="26.4">2.32 from their nearer end, at least the tolerance 2 from both ends,</tspan><tspan x="0" y="40.8">so both are Inside: the loop is the face&apos;s outer loop (1000).</tspan></text></g></svg>