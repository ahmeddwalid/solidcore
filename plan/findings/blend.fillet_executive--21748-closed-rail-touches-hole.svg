<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="430" viewBox="0 0 760 430"><title>21748-closed-rail-touches-hole</title><g id="Layer_1" data-name="Layer 1"><rect id="background" width="760" height="430" x="0" y="0" fill="#fff"/><rect id="face_before" width="300" height="220" x="40" y="110" fill="#f0f0f0" data-name="face before"/><circle id="hole_before" cx="190" cy="170" r="60" fill="#fff" stroke="#555" stroke-miterlimit="10" stroke-width="2" data-name="hole before"/><line id="rail_before" x1="40" x2="340" y1="110" y2="110" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="rail before"/><rect id="face_after" width="300" height="220" x="420" y="110" fill="#f0f0f0" data-name="face after"/><circle id="hole_after" cx="570" cy="170" r="60" fill="#fff" stroke="#555" stroke-miterlimit="10" stroke-width="2" data-name="hole after"/><line id="rail_after" x1="420" x2="720" y1="110" y2="110" fill="none" stroke="#1f6fb2" stroke-miterlimit="10" stroke-width="3" data-name="rail after"/><circle id="vertex_P" cx="570" cy="110" r="5" fill="#000" data-name="vertex P"/><text x="0" y="0" fill="#000" font-family="Helvetica-Bold, sans-serif" font-size="20" transform="matrix(1 0 0 1 40 40)" xml:space="preserve"><tspan x="0" y="0">A closed contact line touches a hole&apos;s edge at one point</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 40 72)" xml:space="preserve"><tspan x="0" y="0">Before: two loops touch at P</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 420 72)" xml:space="preserve"><tspan x="0" y="0">After: P imprinted, one loop</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 215 101)" xml:space="preserve"><tspan x="0" y="0">contact line (rail)</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 256 200)" xml:space="preserve"><tspan x="0" y="0">hole&apos;s edge</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 185 101)" xml:space="preserve"><tspan x="0" y="0">P</tspan></text><text x="0" y="0" fill="#000" font-family="Helvetica, sans-serif" font-size="14" transform="matrix(1 0 0 1 582 101)" xml:space="preserve"><tspan x="0" y="0">vertex P</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 40 346)" xml:space="preserve"><tspan x="0" y="12">The cylinder face, unrolled, below the round. The rail and</tspan><tspan x="0" y="26.4">the hole&apos;s loop meet only at P; kept as two loops they fail</tspan><tspan x="0" y="40.8">Face 38, so the round was refused.</tspan></text><text x="0" y="12" fill="#000" font-family="Helvetica, sans-serif" font-size="12" transform="matrix(1 0 0 1 420 346)" xml:space="preserve"><tspan x="0" y="12">The rail and the hole&apos;s edge are split at P. The face&apos;s</tspan><tspan x="0" y="26.4">boundary is one loop: along the rail to P, round the hole</tspan><tspan x="0" y="40.8">back to P, on along the rail.</tspan></text></g></svg>